name: Sync Upstream (OpenMinis/OpenMinis)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/OpenMinis/OpenMinis.git

      - name: Fetch upstream
        run: git fetch upstream --tags

      - name: Generate sync log
        id: sync_log
        run: |
          LAST_SYNC_MARKER=$(git log --oneline --grep="Sync from OpenMinis" -1 2>/dev/null | awk '{print $1}' || echo "")
          if [ -z "$LAST_SYNC_MARKER" ]; then
            BASE_COMMIT=$(git rev-list --max-parents=0 HEAD 2>/dev/null || echo "HEAD~100")
          else
            BASE_COMMIT="$LAST_SYNC_MARKER"
          fi
          UPSTREAM_HEAD=$(git rev-parse upstream/main)
          DIFF_COUNT=$(git rev-list --count "$BASE_COMMIT".."$UPSTREAM_HEAD" 2>/dev/null || echo "0")
          if [ "$DIFF_COUNT" -eq "0" ]; then
            echo "No new commits to sync"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "has_changes=true" >> $GITHUB_OUTPUT
          SYNC_TIME=$(date '+%Y-%m-%d %H:%M:%S UTC')
          echo "## 同步信息" > SYNC_LOG.md
          echo "" >> SYNC_LOG.md
          echo "- **同步时间**: $SYNC_TIME" >> SYNC_LOG.md
          echo "- **上游仓库**: https://github.com/OpenMinis/OpenMinis" >> SYNC_LOG.md
          echo "- **新增提交**: $DIFF_COUNT 个" >> SYNC_LOG.md
          echo "" >> SYNC_LOG.md
          echo "## 更新内容" >> SYNC_LOG.md
          echo "" >> SYNC_LOG.md
          git log --oneline "$BASE_COMMIT".."$UPSTREAM_HEAD" >> SYNC_LOG.md 2>/dev/null
          echo "" >> SYNC_LOG.md
          echo "## 文件变更统计" >> SYNC_LOG.md
          echo "" >> SYNC_LOG.md
          git diff --stat "$BASE_COMMIT" "$UPSTREAM_HEAD" >> SYNC_LOG.md 2>/dev/null || echo "无统计信息" >> SYNC_LOG.md
          echo "new_commits=$DIFF_COUNT" >> $GITHUB_OUTPUT
          echo "upstream_sha=$UPSTREAM_HEAD" >> $GITHUB_OUTPUT

      - name: Merge upstream into main
        if: steps.sync_log.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge upstream/main --no-edit --allow-unrelated-histories

      - name: Commit sync log
        if: steps.sync_log.outputs.has_changes == 'true'
        run: |
          git add SYNC_LOG.md
          git commit -m "Sync from OpenMinis

          Sync time: $(date '+%Y-%m-%d %H:%M:%S UTC')
          New commits: ${{ steps.sync_log.outputs.new_commits }}

          $(head -10 SYNC_LOG.md | tail -n +3)" || echo "No changes to commit"
          git push origin main

      - name: Push tags
        if: steps.sync_log.outputs.has_changes == 'true'
        run: git push origin --tags

      - name: Post summary
        if: steps.sync_log.outputs.has_changes == 'true'
        run: |
          echo "## 同步完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "新增提交: ${{ steps.sync_log.outputs.new_commits }} 个" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          head -20 SYNC_LOG.md >> $GITHUB_STEP_SUMMARY
        env:
          GITHUB_STEP_SUMMARY: $GITHUB_STEP_SUMMARY

      - name: Skip sync
        if: steps.sync_log.outputs.has_changes == 'false'
        run: |
          echo "## 同步完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "没有新更新，跳过同步" >> $GITHUB_STEP_SUMMARY
        env:
          GITHUB_STEP_SUMMARY: $GITHUB_STEP_SUMMARY
